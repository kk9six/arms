[project]
name = "lyc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.10.0",
    "chumpy>=0.70",
    "clip",
    "einops>=0.8.1",
    "h5py>=3.15.1",
    "ipykernel>=6.30.1",
    "kaleido>=1.0.0",
    "lightning>=2.6.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.5",
    "moviepy>=2.2.1",
    "numpy>=2.3.2",
    "omegaconf>=2.3.0",
    "open3d>=0.19.0",
    "pip>=25.3",
    "rtree>=1.4.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.0",
    "smplx>=0.1.28",
    "tensorboard>=2.20.0",
    "timm>=1.0.22",
    "torch>=2.8.0",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.67.1",
    "trimesh>=4.7.3",
    "wandb>=0.22.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
clip = { git = "https://github.com/openai/CLIP.git" }

[tool.uv]
no-build-isolation-package = ["chumpy"]

[tool.ty.rules]
invalid-method-override = "ignore"
invalid-return-type = "ignore"
invalid-argument-type = "warn"
unresolved-attribute = "ignore"
invalid-assignment = "warn"
not-subscriptable = "warn"
